name: CI/CD Pipeline

on:
  # Se ejecuta cuando haces push o abres PR en estas ramas
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ] 

jobs:
  quality-check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Ejecutamos los tests. Si fallan, Vercel no desplegará.
      - name: Run tests
        run: npm run test
